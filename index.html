<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeedPhrase Mask</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html.light {
    --bg-color:#f3f4f6; --card-bg:#ffffff; --text-color:#1f2937;
    --text-secondary:#4b5563; --border-color:#e5e7eb;
    --scrollbar-track:#f3f4f6; --scrollbar-thumb:#9ca3af;
    --muted:#6b7280; --accent:#2563eb20;
  }
  html.dark {
    --bg-color:#111827; --card-bg:#1f2937; --text-color:#f3f4f6;
    --text-secondary:#d1d5db; --border-color:#374151;
    --scrollbar-track:#111827; --scrollbar-thumb:#6b7280;
    --muted:#9ca3af; --accent:#60a5fa20;
  }
  body {
    background:var(--bg-color); color:var(--text-color);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
    min-height:100vh; padding:2rem; transition: background-color .3s, color .3s;
  }
  h1 { font-size:2rem; font-weight:800; letter-spacing:.2px; }
  .header { display:flex; flex-direction:column; gap:1rem; margin-bottom:1rem; }
  @media(min-width:640px){ .header{ flex-direction:row; justify-content:space-between; align-items:center; } }

  .controls { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .pill {
    display:inline-flex; align-items:center; gap:.5rem; padding:.45rem .7rem;
    border-radius:9999px; background:var(--card-bg); border:1px solid var(--border-color);
  }
  input, button, label { color:var(--text-color); }
  input[type="password"], input[type="text"], input[type="number"] {
    background:transparent; border:0; outline:0; min-width:10ch;
  }
  input::placeholder{ color:var(--muted); }
  .hint { font-size:.9rem; color:var(--text-secondary); }

  button {
    padding:.5rem .9rem; border-radius:.6rem; border:1px solid var(--border-color);
    background:var(--card-bg); cursor:pointer; font-size:1.05rem;
    transition: transform .06s ease;
  }
  button:active { transform: translateY(1px) scale(.99); }

  .container { display:grid; grid-template-columns:1fr; gap:1.2rem; margin-top:1rem; }
  @media(min-width:640px){ .container{ grid-template-columns:repeat(2,1fr);} }
  @media(min-width:768px){ .container{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:1024px){ .container{ grid-template-columns:repeat(4,1fr);} }

  .card {
    background:var(--card-bg); border-radius:1rem; padding:1rem;
    box-shadow: 0 4px 10px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:.5rem;
    border:1px solid var(--border-color);
  }
  .card h2 {
    font-size:1.1rem; font-weight:800; padding-bottom:.35rem;
    border-bottom:1px solid var(--border-color); letter-spacing:.5px;
  }

  ol { padding-left: 2.2rem; color:var(--text-secondary); max-height:18rem; overflow:auto; }
  li { margin:.25rem 0; }
  .row { display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap; }

  .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size:.85rem; border:1px dashed var(--border-color); padding:.05rem .45rem; border-radius:.45rem;
    background:var(--accent); color:var(--text-color);
  }
  .muted { color:var(--muted); }
  .index { min-width:3.2ch; text-align:right; font-variant-numeric: tabular-nums; }
  .divider{height:1px;background:var(--border-color);margin:1rem 0;}

  ol::-webkit-scrollbar { width:12px; }
  ol::-webkit-scrollbar-track { background:var(--scrollbar-track); }
  ol::-webkit-scrollbar-thumb { background-color:var(--scrollbar-thumb); border-radius:6px; border:3px solid var(--scrollbar-track); }
  ol { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex; flex-direction:column; gap:.35rem;">
    <h1>SeedPhrase Mask</h1>
    <div class="hint">Offline seed phrase to password-locked ID converter for discreet backup.</div>
  </div>

  <div class="controls">
    <div class="pill" title="Enter your password">
      <span class="muted">Password</span>
      <input id="passInput" type="password" placeholder="Enter password" autocomplete="off" />
    </div>

    <div class="pill" title="Choose code length (min 3)">
      <span class="muted">Code length</span>
      <input id="lenInput" type="number" min="3" max="12" value="3" />
    </div>

    <div class="pill" title="Search by code or word">
      <input id="searchInput" type="text" placeholder="Search…" autocomplete="off" />
    </div>

    <label class="pill" title="Show official BIP39 index">
      <input id="toggleIndex" type="checkbox" />
      <span>Show BIP39 index</span>
    </label>

    <label class="pill" title="Reveal original words">
      <input id="toggleReveal" type="checkbox" />
      <span>Reveal words</span>
    </label>

    <button id="darkModeToggle" title="Toggle dark mode">🌙</button>
  </div>
</div>

<div class="divider"></div>
<div class="container" id="container"></div>

const enc = new TextEncoder();

async function sha256Hex(inputStr){
  const hashBuf = await crypto.subtle.digest("SHA-256", enc.encode(inputStr));
  const bytes = new Uint8Array(hashBuf);
  let hex = "";
  for (let b of bytes) hex += b.toString(16).padStart(2, "0");
  return hex;
}
function hexToBigInt(hex) { return BigInt("0x" + hex); }
function bigIntToBase36(bi) { return bi.toString(36).toUpperCase(); }

async function generateCode(word, passphrase, length){
  if (!passphrase) return "—".repeat(Math.max(3, Math.min(length, 12)));
  const hex = await sha256Hex(`${passphrase}|${word}`);
  const b36 = bigIntToBase36(hexToBigInt(hex));
  let out = b36;
  while (out.length < length) out += b36;
  return out.slice(0, length);
}

function groupByFirstLetter(words){
  const grouped = {};
  for(const word of words){
    const first = (word[0] || "").toUpperCase();
    if(!grouped[first]) grouped[first] = [];
    grouped[first].push(word);
  }
  return grouped;
}

const container   = document.getElementById("container");
const passInput   = document.getElementById("passInput");
const lenInput    = document.getElementById("lenInput");
const searchInput = document.getElementById("searchInput");
const toggleIndex = document.getElementById("toggleIndex");
const toggleReveal= document.getElementById("toggleReveal");

let state = {
  passphrase: "",
  codeLength: Math.max(3, Math.min(parseInt(lenInput.value,10)||3, 12)),
  showIndex: false,
  revealWords: false,
  search: "",
  codesByWord: new Map(),
};

function normalize(s){ return (s||"").trim().toLowerCase(); }
function matchesSearch(word, code){
  const q = normalize(state.search);
  if(!q) return true;
  return normalize(word).includes(q) || normalize(code).includes(q);
}

async function recomputeCodes(){
  const words = wordlists.english;
  const map = new Map();
  if (state.passphrase) {
    await Promise.all(words.map(async w => {
      map.set(w, await generateCode(w, state.passphrase, state.codeLength));
    }));
  } else {
    words.forEach(w => { map.set(w, "—".repeat(state.codeLength)); });
  }
  state.codesByWord = map;
}

async function render(){
  await recomputeCodes();
  const words = wordlists.english;
  const grouped = groupByFirstLetter(words);
  container.innerHTML = "";

  Object.keys(grouped).sort().forEach(letter=>{
    const items = grouped[letter].map(w=>{
      const code = state.codesByWord.get(w) || "";
      const indexGlobal = words.indexOf(w) + 1;
      return { word:w, code, indexGlobal };
    }).filter(row => matchesSearch(row.word, row.code));

    if (items.length === 0) return;

    const card = document.createElement("div");
    card.className = "card";

    const header = document.createElement("h2");
    header.textContent = letter;
    card.appendChild(header);

    const list = document.createElement("ol");
    for (const row of items){
      const li = document.createElement("li");
      const wrap = document.createElement("div");
      wrap.className = "row";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = row.code;
      wrap.appendChild(tag);

      if (state.showIndex) {
        const idx = document.createElement("span");
        idx.className = "index muted";
        idx.textContent = `#${row.indexGlobal}`;
        wrap.appendChild(idx);
      }

      if (state.revealWords && state.passphrase) {
        const wordSpan = document.createElement("span");
        wordSpan.textContent = row.word;
        wrap.appendChild(wordSpan);
      } else {
        const hidden = document.createElement("span");
        hidden.className = "muted";
        hidden.textContent = "••••••";
        wrap.appendChild(hidden);
      }

      li.appendChild(wrap);
      list.appendChild(li);
    }

    card.appendChild(list);
    container.appendChild(card);
  });
}

let debounce;
function queueRender(delay=80){
  clearTimeout(debounce);
  debounce = setTimeout(render, delay);
}

passInput.addEventListener("input", ()=>{
  state.passphrase = passInput.value;
  queueRender();
});

lenInput.addEventListener("input", ()=>{
  const v = parseInt(lenInput.value, 10);
  state.codeLength = Math.min(Math.max(isNaN(v)?3:v, 3), 12); // mínimo absoluto = 3
  lenInput.value = state.codeLength; // força campo a mostrar o valor válido
  queueRender();
});

searchInput.addEventListener("input", ()=>{
  state.search = searchInput.value;
  queueRender(0);
});

toggleIndex.addEventListener("change", ()=>{
  state.showIndex = toggleIndex.checked;
  queueRender(0);
});

toggleReveal.addEventListener("change", ()=>{
  state.revealWords = toggleReveal.checked;
  queueRender(0);
});

const toggleBtn = document.getElementById('darkModeToggle');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let savedTheme = localStorage.getItem('theme');
if(savedTheme){
  document.documentElement.classList.remove('light', 'dark');
  document.documentElement.classList.add(savedTheme);
} else {
  document.documentElement.classList.remove('light', 'dark');
  document.documentElement.classList.add(systemPrefersDark ? 'dark' : 'light');
}
function updateToggleIcon(){
  toggleBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
}
updateToggleIcon();
toggleBtn.addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  document.documentElement.classList.toggle('light', !isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateToggleIcon();
});

render();
</script>
</body>
</html>
